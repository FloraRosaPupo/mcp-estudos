[project]
name = "mcp-estudos"
version = "0.1.0"
description = "Servidor e chatbot MCP de estudo (busca de artigos no arXiv)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<3",
    "arxiv",
    "anthropic",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
